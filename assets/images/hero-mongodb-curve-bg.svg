<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" width="100%" height="100%" preserveAspectRatio="xMaxYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <!-- Curve Panel Gradients (DevSpireHub Dark Palette) -->
    <linearGradient id="curvePanelSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17324D" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#10243A" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0A1724" stop-opacity="1.0" />
    </linearGradient>

    <!-- Asymmetrical Curve Rim Lighting Gradient (Teal #19BAAF -> Orange #E54415) -->
    <linearGradient id="curveRimGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19BAAF" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#19BAAF" stop-opacity="0.30" />
      <stop offset="80%" stop-color="#E54415" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#E54415" stop-opacity="0.10" />
    </linearGradient>

    <!-- Edge Softening Filter for Glow Rim -->
    <filter id="rimBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Ambient Glows inside the Technical Panel -->
    <radialGradient id="ambientTealGlow" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#19BAAF" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#19BAAF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#19BAAF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientOrangeGlow" cx="88%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#E54415" stop-opacity="0.09" />
      <stop offset="60%" stop-color="#E54415" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#E54415" stop-opacity="0" />
    </radialGradient>

    <!-- Mask to Soften Technical Content Fading toward S-Curve Boundary & Corners -->
    <linearGradient id="contentFadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" />
      <stop offset="14%" stop-color="#444" />
      <stop offset="35%" stop-color="#fff" />
      <stop offset="90%" stop-color="#fff" />
      <stop offset="100%" stop-color="#111" />
    </linearGradient>
    <mask id="panelContentMask">
      <rect x="700" y="0" width="740" height="680" fill="url(#contentFadeMask)" />
    </mask>

    <!-- Fine Architectural Grid Pattern -->
    <pattern id="archGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#B7C1CB" stroke-width="0.75" stroke-opacity="0.04" />
      <circle cx="36" cy="36" r="0.8" fill="#AAB4C0" fill-opacity="0.06" />
    </pattern>
  </defs>

  <!-- 1. BASE ORGANIC S-CURVE PANEL: Sweeps from (1200, 0) through (760, 320) to (710, 680) -->
  <path d="M 1200,0 C 1040,70 760,260 760,340 C 760,420 720,580 710,680 L 1440,680 L 1440,0 Z" fill="url(#curvePanelSurface)" />

  <!-- 2. INTERNAL AMBIENT LIGHTING (Teal & Orange Lighting Layers) -->
  <path d="M 1200,0 C 1040,70 760,260 760,340 C 760,420 720,580 710,680 L 1440,680 L 1440,0 Z" fill="url(#ambientTealGlow)" />
  <path d="M 1200,0 C 1040,70 760,260 760,340 C 760,420 720,580 710,680 L 1440,680 L 1440,0 Z" fill="url(#ambientOrangeGlow)" />

  <!-- 3. LUMINESCENT ORGANIC RIM (Dual-stop glowing boundary) -->
  <path d="M 1200,0 C 1040,70 760,260 760,340 C 760,420 720,580 710,680" fill="none" stroke="url(#curveRimGlow)" stroke-width="2.5" filter="url(#rimBlur)" />
  <path d="M 1200,0 C 1040,70 760,260 760,340 C 760,420 720,580 710,680" fill="none" stroke="url(#curveRimGlow)" stroke-width="1.2" />

  <!-- 4. COHESIVE TECHNICAL VISUAL REGION (Masked to avoid harsh cutoffs) -->
  <g mask="url(#panelContentMask)">
    <!-- Architectural Grid Background -->
    <!-- archGrid removed per user request -->

    <!-- A. Programming & Software Development Motif -->
    <g font-family="'Fira Code', 'Consolas', monospace" font-size="11" letter-spacing="0.3">
      <text x="880" y="95" opacity="0.15" fill="#AAB4C0">
        <tspan fill="#E54415">async def</tspan> <tspan fill="#19BAAF">dispatch_pipeline</tspan>(ctx: Context) -&gt; Stream:
      </text>
      <text x="900" y="115" opacity="0.12" fill="#AAB4C0">
        <tspan fill="#19BAAF">yield from</tspan> ctx.transform_tensors(batch_size=64)
      </text>
      <text x="900" y="135" opacity="0.11" fill="#AAB4C0">
        <tspan fill="#E54415">return</tspan> <tspan fill="#19BAAF">Result</tspan>.ok(stream.verify_checksum())
      </text>
    </g>

    <!-- B. Artificial Intelligence & Neural Graph (Connected Nodes & Synapses) -->
    <g opacity="0.85">
      <!-- Neural Synapse Connections -->
      <path d="M 870 230 Q 930 195 990 190" stroke="#19BAAF" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.24" />
      <path d="M 870 230 Q 930 250 990 260" stroke="#19BAAF" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.22" />
      <path d="M 990 190 Q 1050 200 1110 215" stroke="#E54415" stroke-width="1" opacity="0.25" />
      <path d="M 990 260 Q 1050 240 1110 215" stroke="#19BAAF" stroke-width="1" opacity="0.22" />
      <path d="M 990 260 Q 1050 280 1110 285" stroke="#19BAAF" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.20" />

      <!-- Synaptic Nodes -->
      <circle cx="870" cy="230" r="3.5" fill="#151E2C" stroke="#19BAAF" stroke-width="1.5" opacity="0.45" />
      <circle cx="990" cy="190" r="4.5" fill="#18283A" stroke="#E54415" stroke-width="1.8" opacity="0.55" />
      <circle cx="990" cy="260" r="3.5" fill="#151E2C" stroke="#19BAAF" stroke-width="1.5" opacity="0.4" />
      <circle cx="1110" cy="215" r="4" fill="#18283A" stroke="#19BAAF" stroke-width="1.6" opacity="0.45" />
      <circle cx="1110" cy="285" r="3" fill="#151E2C" stroke="#B7C1CB" stroke-width="1.2" opacity="0.35" />
    </g>

    <!-- C. Networking & Infrastructure Motif (Topology bus lines & Endpoint IP Telemetry) -->
    <g opacity="0.8">
      <path d="M 1040 370 L 1150 370 L 1190 410 L 1320 410" stroke="#19BAAF" stroke-width="1.2" opacity="0.26" stroke-dasharray="6 4" />
      <path d="M 1150 370 L 1150 450 L 1230 450" stroke="#091726" stroke-width="1" opacity="0.3" />
      
      <!-- Network Nodes -->
      <circle cx="1040" cy="370" r="3.5" fill="#091726" stroke="#19BAAF" stroke-width="1.5" opacity="0.4" />
      <circle cx="1190" cy="410" r="3" fill="#091726" stroke="#E54415" stroke-width="1.5" opacity="0.45" />
      <circle cx="1320" cy="410" r="4" fill="#091726" stroke="#19BAAF" stroke-width="1.8" opacity="0.45" />

      <text x="1055" y="360" font-family="'Fira Code', monospace" font-size="9" opacity="0.18" fill="#19BAAF">
        10.240.0.0/16 · BGP-ESTABLISHED · MTU 9000
      </text>
    </g>

    <!-- D. Cybersecurity & Ethical Hacking Motif (Geometric Shield & Cryptographic Hash) -->
    <g opacity="0.75">
      <path d="M 1220 180 L 1270 160 L 1320 180 L 1320 230 C 1320 270 1270 300 1270 300 C 1270 300 1220 270 1220 230 Z" stroke="#E54415" stroke-width="1" stroke-dasharray="4 3" opacity="0.22" fill="none" />
      <circle cx="1270" cy="225" r="6" fill="none" stroke="#E54415" stroke-width="1" opacity="0.20" />
      
      <text x="1235" y="245" font-family="'Fira Code', monospace" font-size="8.5" opacity="0.16" fill="#E54415">
        TLS 1.3 · AES-256-GCM
      </text>
      <text x="1235" y="258" font-family="'Fira Code', monospace" font-size="8" opacity="0.14" fill="#AAB4C0">
        sha256: 7f83b165...verified
      </text>
    </g>

    <!-- E. Projects & Practical Developer Tutorials (CLI Telemetry & Build Prompt) -->
    <g font-family="'Fira Code', monospace" font-size="10" letter-spacing="0.2">
      <text x="880" y="520" opacity="0.16" fill="#AAB4C0">
        <tspan fill="#E54415">$</tspan> devspire build --target=production --modules=all
      </text>
      <text x="880" y="538" opacity="0.14" fill="#19BAAF">
        [200 OK] 4 core modules loaded · 0-tracking confirmed · 0ms drift
      </text>
    </g>
  </g>
</svg>