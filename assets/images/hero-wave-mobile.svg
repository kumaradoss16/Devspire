      <stop offset="0%" stop-color="#17324D" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#10243A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0A1724" stop-opacity="1.0" />
    </linearGradient>
    <linearGradient id="waveMobRim" x1="0%" y1="0%" x2="100%" y2="0%">
