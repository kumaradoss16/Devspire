<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="mobCurveSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18283A" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#151E2C" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#091726" stop-opacity="1.0" />
    </linearGradient>
    <linearGradient id="mobRimGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19BAAF" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#19BAAF" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#E54415" stop-opacity="0.25" />
    </linearGradient>
    <filter id="mobRimBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Organic asymmetrical curve transitioning to deeper surface at bottom behind console -->
  <path d="M 0,90 C 120,40 260,110 420,50 L 420,280 L 0,280 Z" fill="url(#mobCurveSurface)" />
  <path d="M 0,90 C 120,40 260,110 420,50" fill="none" stroke="url(#mobRimGlow)" stroke-width="2" filter="url(#mobRimBlur)" />
  <path d="M 0,90 C 120,40 260,110 420,50" fill="none" stroke="url(#mobRimGlow)" stroke-width="1.2" />
</svg>